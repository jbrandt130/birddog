<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Birddog Logs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <style>
    body {
      padding: 2rem;
      background-color: #f8f9fa;
    }
    #log-container {
      height: 80vh;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: monospace;
      background-color: #fff;
      padding: 1rem;
      border: 1px solid #dee2e6;
      border-radius: .5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Birddog Logs</h2>
    <div class="mb-3 d-flex align-items-center">
      <label for="log-limit" class="form-label me-2">Show latest</label>
      <select id="log-limit" class="form-select me-3" style="width: auto;" onchange="loadLogs()">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="500">1000</option>
      </select>
      <button class="btn btn-primary" onclick="loadLogs()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
    <div id="log-container">Loading logs...</div>
  </div>

  <script>
    async function loadLogs() {
      const limit = document.getElementById('log-limit').value;
      const container = document.getElementById('log-container');
      container.innerText = 'Loading logs...';
      try {
        const response = await fetch(`/log?limit=${limit}`);
        if (!response.ok) throw new Error(`Status: ${response.status}`);
        const logArray = await response.json(); // array of strings
        container.innerText = logArray.join('\n') || '(no logs returned)';
      } catch (err) {
        container.innerText = `Failed to load logs: ${err}`;
      }
    }

    window.onload = loadLogs;
  </script>
</body>
</html>
