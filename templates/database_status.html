<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Birddog Database Update Status</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="container">
    <div class="d-flex align-items-center mb-4">
      <h2 class="mb-0 me-3">Database Update Status</h2>
      <!-- <button class="btn btn-outline-primary btn-sm" onclick="loadStatus()">Refresh</button> -->
      <span id="refresh-indicator" class="ms-3 text-muted small"></span>
    </div>

    <div id="status-area">
      <p class="text-muted">Loading...</p>
    </div>
  </div>

  <script>
    let refreshTimer = null;

    async function loadStatus() {
      try {
        const resp = await fetch('/database_update');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        renderTasks(data.tasks || {});
        document.getElementById('refresh-indicator').textContent =
          'Last status refresh: ' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('status-area').innerHTML =
          `<div class="alert alert-danger">Failed to load status: ${err}</div>`;
      }
    }

    function renderTasks(tasks) {
      const area = document.getElementById('status-area');
      const names = Object.keys(tasks);
      if (names.length === 0) {
        area.innerHTML = '<p class="text-muted">No active update tasks.</p>';
        return;
      }

      const rows = names.map(name => {
        const t = tasks[name];
        const deep = t.deep ? 'Yes' : 'No';
        return `
          <tr>
            <td>${escapeHtml(t.titles ?? '')}</td>
            <td>${t.total ?? ''}</td>
            <td>${t.completed ?? ''}</td>
            <td>${deep}</td>
            <td>
              <button class="btn btn-sm btn-danger" data-task="${escapeHtml(name)}" onclick="cancelTask('${name}')">
                Cancel
              </button>
            </td>
          </tr>`;
      }).join('');

      area.innerHTML = `
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th>Titles</th>
              <th>Length</th>
              <th>Completed</th>
              <th>Deep</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    async function cancelTask(taskName) {
      if (!confirm(`Cancel database update task ${taskName}?`)) return;
      try {
        const resp = await fetch(
          `/database_cancel_task?task=${encodeURIComponent(taskName)}`,
          { method: 'POST' }
        );
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          alert(`Cancel failed: ${body.error || resp.status}`);
        }
        else {
          alert(`Update task ${taskName} cancel sent. It may take a few minutes to fully cancel the process.`);
        }
      } catch (err) {
        alert(`Cancel request failed: ${err}`);
      }
      await loadStatus();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function scheduleRefresh() {
      refreshTimer = setTimeout(async () => {
        await loadStatus();
        scheduleRefresh();
      }, 5000);
    }

    window.onload = async () => {
      await loadStatus();
      scheduleRefresh();
    };
  </script>
</body>
</html>
