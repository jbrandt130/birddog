<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birddog Export Modal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet">
</head>
<body>

<!-- Modal Trigger -->
<div class="container mt-5">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exportModal">Open Export Modal</button>
</div>

<!-- Modal -->
<div class="modal fade" id="exportModal" tabindex="-1" aria-labelledby="exportModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="exportModalLabel">Export Table Configuration: {{ page_title }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">

        <!-- Export Template Selection -->
        <div class="mb-4">
          <label for="templateSelect" class="form-label">Choose Export Template</label>
          <select id="templateSelect" class="form-select">
            {% for template in templates %}
              {% set display_name = template.rsplit('.', 1)[0].capitalize() %}
              <option value="{{ template }}">{{ display_name }}</option>
            {% endfor %}
          </select>
        </div>
        <!-- Export Columns Configuration -->
        {% for col in column_classes %}
          {% set col_id = 'export_' + col.replace(' ', '_').lower() %}
          <div class="mb-3">
            <label class="form-label">Export Column: {{ col }}</label>
            <input class="form-control tag-input" id="{{ col_id }}" placeholder="Select source columns...">
          </div>
        {% endfor %}


      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success">Export</button>
      </div>

    </div>
  </div>
</div>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>

<script>
  const column_headers = {{ column_headers | tojson }};
  const column_classes = {{ column_classes | tojson }};
  const templates = {{ templates | tojson }};
  const default_template = {{ default_template | tojson }};
  const column_header_map = {{ column_header_map | tojson }};

  console.log("column_classes:", column_classes);
  console.log("column_headers:", column_headers);
  console.log("templates:", templates);
  console.log("default_template:", default_template);

  function sanitizeId(colName) {
    return 'export_' + colName.toLowerCase().replace(/\s+/g, '_');
  }

  // assign default template value to selector
  document.getElementById("templateSelect").value = default_template;

  column_classes.forEach(col => {
    const inputId = sanitizeId(col);
    const input = document.getElementById(inputId);
    if (input) {
      const tagify = new Tagify(input, {
        whitelist: column_headers,
        dropdown: {
          enabled: 0,
          fuzzySearch: true,
          position: 'auto'
        },
        enforceWhitelist: true,
        duplicates: true
      });

      // Prepopulate with the mapped header if defined
      const headerIndex = column_header_map[col];
      if (headerIndex !== undefined && column_headers[headerIndex]) {
        tagify.removeAllTags();
        tagify.addTags([column_headers[headerIndex]]);
      }
    } else {
      console.warn("Missing input for:", inputId);
    }
  });
</script>

</body>
</html>
