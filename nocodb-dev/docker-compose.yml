services:
  nocodb:
    image: nocodb/nocodb:2026.06.2
    container_name: nocodb
    ports:
      - "8080:8080"
    volumes:
      - /Users/jbrandt/code/birddog/nocodb:/usr/app/data/
    environment:
      # audit log grew nc_audit_v2 to ~7 GB / 3.8M rows and wedged the
      # single-connection SQLite pool; not needed on a local dev instance
      - NC_DISABLE_AUDIT=true
    restart: unless-stopped
